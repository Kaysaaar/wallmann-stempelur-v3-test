<title>ASTRA QA · iPhone</title><style>html{background:#173d2f;color-scheme:dark;height:100%;}*{box-sizing:border-box}body{margin:0;background:#173d2f;color:#edf8ef;font:17px system-ui,sans-serif;height:100vh;height:100dvh;overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}[hidden]{display:none!important}#app{height:100%;background:#173d2f}iframe{display:block;border:0;width:100%;height:100%;background:#173d2f}#setup{height:100%;overflow:auto;max-width:520px;margin:auto;padding:28px 22px}h1{font-size:26px}p{line-height:1.5;color:#d1e4d6}label{display:block;font-weight:650;margin:24px 0 10px}input,button{font:inherit;min-height:48px;border:1px solid #86a492;border-radius:12px;background:#102c20;color:#f0fff3;padding:12px;width:100%}button{margin-top:16px;background:#285442;font-weight:700}input:focus-visible,button:focus-visible{outline:3px solid #43f58a;outline-offset:3px}#error{color:#ffd3ca}small{display:block;margin-top:22px;line-height:1.5;color:#bbd2c2}</style></head><body>
<main id="setup"><h1>ASTRA · isoleret iPhone-test</h1><p>Denne indgang bruger kun den isolerede kopi med QA-testnavne.</p>
<form id="connect"><label for="link">Privatlink til QA-kopien</label><input id="link" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required><button type="submit">Åbn isoleret test</button><p id="error" role="alert"></p></form>
<small>Åbn testuret først. Vælg derefter Del → Føj til hjemmeskærm i Safari. Behold det eksisterende stempelursikon under testen. Privatlinket skal behandles som en nøgle og må ikke deles.</small></main>
<div id="app" hidden></div><script>(()=>{
'use strict';
const BASE='https://script.google.com/a/macros/wallmannapps.com/s/AKfycbzgkC9bBAuiLc2e809nM0rpYl9vqXDsUdfUhHCG4V6uMQz15va41zuOtgVrjda29k4/exec';
const $=id=>document.getElementById(id);
function keyFromLink(value){
 const u=new URL(value);
 const target=new URL(BASE);
 if(u.origin!==target.origin||![target.pathname,target.pathname.replace('/a/macros/wallmannapps.com/','/a/wallmannapps.com/macros/'),target.pathname.replace('/a/macros/wallmannapps.com/','/macros/')].includes(u.pathname)||u.username||u.password)throw Error('Brug privatlinket fra den isolerede QA-kopi. WALLMANN TEST-linket kan ikke bruges her.');
 const key=u.searchParams.get('kioskKey');
 if(!/^[a-f0-9]{64}$/.test(key||''))throw Error('Linket mangler en gyldig QA-enhedsnøgle.');
 return key;
}
function open(key){
 const u=new URL(BASE);u.searchParams.set('kioskKey',key);u.searchParams.set('v','iphone-entry-1');
 const frame=document.createElement('iframe');frame.title='ASTRA · isoleret stempelur';frame.referrerPolicy='no-referrer';
 frame.src=u.href;$('app').replaceChildren(frame);$('setup').hidden=true;$('app').hidden=false;
 // No message bridge, tokens, polling, retries or stamp calls in this outer page.
 // The existing Google application owns all authorization and durable acknowledgements.
}
$('connect').addEventListener('submit',e=>{
 e.preventDefault();try{const key=keyFromLink($('link').value.trim());history.replaceState(null,'','#kioskKey='+key);$('link').value='';$('error').textContent='';open(key);}catch(err){$('error').textContent=err.message;}
});
const key=new URLSearchParams(location.hash.slice(1)).get('kioskKey');
if(key){if(/^[a-f0-9]{64}$/.test(key))open(key);else $('error').textContent='Testlinket er ugyldigt. Indsæt det private QA-link igen.';}
})();</script></body></html>
